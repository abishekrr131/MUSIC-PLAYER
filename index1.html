<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hall of Fame - Music Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* Player */
.player{
    width:330px;
    background:#111;
    color:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 25px 40px rgba(0,0,0,0.6);
}

/* Album */
.cover{
    height:210px;
    border-radius:14px;
    background: linear-gradient(135deg,#f7971e,#ffd200);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:64px;
    margin-bottom:16px;
    transition:0.4s;
}

.cover:hover{
    transform:scale(1.03);
}

/* Song Info */
.song{
    text-align:center;
}

.song h2{
    font-size:19px;
    letter-spacing:1px;
}

.song p{
    font-size:13px;
    color:#bbb;
    margin-top:4px;
}

/* Progress */
.progress-box{
    margin:16px 0;
}

.time{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#aaa;
    margin-bottom:6px;
}

.bar{
    height:6px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:25%;
    background:linear-gradient(90deg,#f7971e,#ffd200);
    animation:move 6s infinite alternate;
}

@keyframes move{
    from{ width:15%; }
    to{ width:90%; }
}

/* Controls */
.controls{
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin-top:14px;
}

.btn{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#1c1c1c;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

.btn:hover{
    background:#ffd200;
    color:#000;
    transform:scale(1.1);
}

.play{
    width:64px;
    height:64px;
    font-size:24px;
    background:linear-gradient(135deg,#f7971e,#ffd200);
    color:#000;
}

.play:active{
    transform:scale(0.95);
}
</style>

</head>
<body>

<div class="player">

    <div class="cover">🏆</div>

    <div class="song">
        <h2>HALL OF FAME</h2>
        <p>The Script ft. will.i.am</p>
    </div>

    <div class="progress-box">
        <div class="time">
            <span>1:05</span>
            <span>3:22</span>
        </div>
        <div class="bar">
            <div class="fill"></div>
        </div>
    </div>

    <div class="controls">
        <div class="btn">⏮</div>
        <div class="btn play">▶</div>
        <div class="btn">⏭</div>
    </div>

</div>

</body>
</html>
